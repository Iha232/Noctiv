<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <h1>Noctiv</h1>
      <span class="version">v1.0.0</span>
    </header>
    
    <div class="popup-section">
      <h2>Theme</h2>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="dark" title="Dark Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="theme-btn" data-theme="light" title="Light Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
        <button class="theme-btn" data-theme="system" title="System Default">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </button>
      </div>
      <div class="current-theme">Current: <span id="currentTheme">Loading...</span></div>
    </div>
    
    <div class="popup-section">
      <h2>Ad Block</h2>
      <label class="toggle">
        <input type="checkbox" id="adblockToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Block Ads & Trackers</span>
      </label>
      <div class="stats" id="adblockStats">Blocked: <span id="blockedCount">--</span></div>
    </div>
    
    <div class="popup-section">
      <h2>Current Site</h2>
      <label class="toggle">
        <input type="checkbox" id="allowlistToggle">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Disable on this site</span>
      </label>
      <div class="site-info" id="siteInfo">Loading...</div>
    </div>
    
    <div class="popup-section">
      <h2>Document Viewers</h2>
      <label class="toggle">
        <input type="checkbox" id="pdfToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Dark mode for PDFs</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="officeToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Dark mode for PPT/Slides</span>
      </label>
    </div>
    
    <footer class="popup-footer">
      <button id="optionsBtn" class="btn-link">Open Full Settings</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
